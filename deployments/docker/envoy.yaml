static_resources:
  listeners:
    # HTTP/1.1 listener for REST API
    - name: http_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: apmc_api
                      domains: ["*"]
                      routes:
                        # Health check
                        - match:
                            prefix: "/health"
                          route:
                            cluster: gateway_service
                        # Auction REST endpoints
                        - match:
                            prefix: "/api/v1/auctions"
                          route:
                            cluster: gateway_service
                        # Market data endpoints
                        - match:
                            prefix: "/api/v1/market"
                          route:
                            cluster: gateway_service
                        # WebSocket for WebRTC signaling
                        - match:
                            prefix: "/ws"
                          route:
                            cluster: gateway_service
                        # Metrics
                        - match:
                            prefix: "/metrics"
                          route:
                            cluster: gateway_service
                http_filters:
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      allow_origin_string_match:
                        - prefix: "*"
                      allow_methods: "GET,PUT,POST,DELETE,OPTIONS"
                      allow_headers: "authorization,content-type,x-requested-with,x-client-id"
                      expose_headers: "x-trace-id"
                      max_age: "3600"
                  - name: envoy.filters.http.rate_limit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.rate_limit.v3.RateLimit
                      domain: apmc-gateway
                      rate_limit_service:
                        grpc_service:
                          envoy_grpc:
                            cluster_name: rate_limit_service
                  - name: envoy.filters.http.router
    # gRPC listener for internal service communication
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_grpc
                route_config:
                  name: grpc_route
                  virtual_hosts:
                    - name: apmc_grpc
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                            grpc: {}
                          route:
                            cluster: grpc_services
                http_filters:
                  - name: envoy.filters.http.router
    # Admin interface
    - name: admin_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: admin
                route_config:
                  name: admin_route
                  virtual_hosts:
                    - name: admin
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: admin_service
                http_filters:
                  - name: envoy.filters.http.router

  clusters:
    # Gateway service cluster
    - name: gateway_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: gateway_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: gateway
                      port_value: 8000
      health_checks:
        - timeout: 5s
          interval: 10s
          unhealthy_threshold: 3
          healthy_threshold: 2
          http_health_check:
            path: /health

    # gRPC services cluster (auction, signaling, p2p, naming)
    - name: grpc_services
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      http2_protocol_options: {}
      load_assignment:
        cluster_name: grpc_services
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: auction
                      port_value: 50051
              - endpoint:
                  address:
                    socket_address:
                      address: signaling
                      port_value: 50052
              - endpoint:
                  address:
                    socket_address:
                      address: p2p
                      port_value: 50053
              - endpoint:
                  address:
                    socket_address:
                      address: naming
                      port_value: 50054
      health_checks:
        - timeout: 5s
          interval: 10s
          grpc_health_check:
            service_name: ""

    # Rate limit service (placeholder)
    - name: rate_limit_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: rate_limit_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: rate-limit
                      port_value: 8080

    # Admin service
    - name: admin_service
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: admin_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 0.0.0.0
                      port_value: 9901

admin:
  access_log_path: /tmp/admin_access.log
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

layered_runtime:
  layers:
    - name: static_layer_0
      static_layer:
        envoy:
          resource_limits:
            listener:
              example_listener:
                connection_limit: 10000

tracing:
  http:
    name: envoy.tracers.opentelemetry
    typed_config:
      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
      grpc_service:
        envoy_grpc:
          cluster_name: jaeger
      service_name: apmc-gateway

  grpc:
    name: envoy.tracers.opentelemetry
    typed_config:
      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
      grpc_service:
        envoy_grpc:
          cluster_name: jaeger
      service_name: apmc-gateway

clusters:
  - name: jaeger
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: jaeger
      endpoints:
        - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: jaeger
                    port_value: 14250