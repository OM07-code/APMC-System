global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'apmc-local'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'apmc-services'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)

  - job_name: 'apmc-node'
    static_configs:
      - targets: ['host.docker.internal:9090']

  - job_name: 'auction-service'
    static_configs:
      - targets: ['auction:50051']
        labels:
          service: 'auction'

  - job_name: 'signaling-service'
    static_configs:
      - targets: ['signaling:50052']
        labels:
          service: 'signaling'

  - job_name: 'p2p-service'
    static_configs:
      - targets: ['p2p:50053']
        labels:
          service: 'p2p'

  - job_name: 'naming-service'
    static_configs:
      - targets: ['naming:50054']
        labels:
          service: 'naming'

  - job_name: 'gateway-service'
    static_configs:
      - targets: ['gateway:8000']
        labels:
          service: 'gateway'

  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
        labels:
          service: 'redpanda'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'