$kind: http-request
url: "{{base_url}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "auctioneer.postman@example.com",
      "password": "password123",
      "full_name": "Suresh (APMC Official)",
      "role": "auctioneer"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      pm.environment.set("auctioneer_token", jsonData.access_token);
      pm.environment.set("auctioneer_id", jsonData.user.id);
      console.log("Saved auctioneer_token and auctioneer_id:", jsonData.user.id);
    language: text/javascript
order: 2000
